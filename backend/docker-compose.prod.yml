# docker-compose.prod.yml — override de produccion (VPS con dominio + TLS).
#
# Reemplaza el mapeo de puertos de caddy del compose base: en prod Caddy
# necesita el 80 (challenge ACME de Let's Encrypt + redirect a HTTPS) y el
# 443 (HTTPS). El compose base mapea ${PORT}:${PORT}, que en prod (PORT=443)
# duplicaria el 443 — por eso `!override` pisa la lista completa.
#
# Uso (en el VPS, con .env de produccion — ver README):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  caddy:
    ports: !override
      - "80:80"
      - "443:443"
